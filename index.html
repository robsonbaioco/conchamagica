<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<title>Concha Mágica</title>

	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Faça uma pergunta e a Concha Mágica responde. Todos saúdam a Concha Mágica!">

	<!-- Prévia ao compartilhar o link (WhatsApp, Telegram, Discord, redes sociais) -->
	<meta property="og:type" content="website">
	<meta property="og:site_name" content="Concha Mágica">
	<meta property="og:title" content="Concha Mágica">
	<meta property="og:description" content="Faça uma pergunta e a Concha Mágica responde.&#10;Todos saúdam a Concha Mágica!">
	<meta property="og:url" content="https://robsonbaioco.github.io/conchamagica/">
	<meta property="og:image" content="https://robsonbaioco.github.io/conchamagica/images/og-preview.jpg">
	<meta property="og:image:width" content="1200">
	<meta property="og:image:height" content="630">
	<meta property="og:image:alt" content="A Concha Mágica sobre o fundo de flores da Fenda do Biquíni">
	<meta property="og:locale" content="pt_BR">
	<meta name="twitter:card" content="summary_large_image">

	<link rel="stylesheet" type="text/css" href="css/libs/monalisa.css">
	<link rel="stylesheet" type="text/css" href="css/style.css">
</head>
<body style="background-image: url(images/bg.jpg)">

	<!-- Mostra a bandeira do idioma atual; ao clicar, troca para o outro -->
	<button type="button" class="idioma" id="idioma" aria-label="Switch to English" title="Switch to English">
		<svg class="_pt" viewBox="0 0 20 14" aria-hidden="true">
			<rect width="20" height="14" fill="#009c3b"/>
			<polygon points="10,1.7 18.3,7 10,12.3 1.7,7" fill="#ffdf00"/>
			<circle cx="10" cy="7" r="3.3" fill="#002776"/>
			<path d="M6.9 6.2 Q10 5.4 13.1 7.4" stroke="#fff" stroke-width="0.6" fill="none"/>
		</svg>
		<svg class="_en" viewBox="0 0 190 130" aria-hidden="true">
			<defs>
				<pattern id="estrelas" width="12.67" height="14" patternUnits="userSpaceOnUse" x="3" y="3">
					<circle cx="3.2" cy="3.2" r="2.4" fill="#fff"/>
				</pattern>
			</defs>
			<rect width="190" height="130" fill="#b22234"/>
			<path d="M0 15h190M0 35h190M0 55h190M0 75h190M0 95h190M0 115h190" stroke="#fff" stroke-width="10"/>
			<rect width="76" height="70" fill="#3c3b6e"/>
			<rect width="76" height="70" fill="url(#estrelas)"/>
		</svg>
	</button>

	<div class="container">

		<div class="content">
			<div class="concha" id="concha">
				<img src="images/conchasempino.png" id="concha-img" alt="Concha Mágica">

				<p class="answer" id="answer" aria-live="polite"><span></span></p>

				<img class="egg" id="egg" src="images/saudacao1.gif" alt="Todos saúdam a Concha Mágica!">
			</div>

			<form action="#" class="Form" method="POST">
				<div class="form-item">
					<div class="_append">
						<input type="text" name="question" placeholder="Faça uma pergunta à Concha Mágica">
						<button class="Button">Perguntar</button>
					</div>
				</div>
			</form>
		</div>
	</div>

	<!-- Corda e pino ficam fora do .content para poderem sair da área da concha -->
	<canvas class="corda" id="corda"></canvas>
	<div class="pino" id="pino">
		<img src="images/pino.png" draggable="false" alt="">
	</div>

	<script src="js/libs/jquery.min.js"></script>
	<script src="js/libs/wow.min.js"></script>
	<script src="js/libs/matter.min.js"></script>
	<script src="js/audio.js"></script>
	<script src="js/answer.js"></script>
	<script src="js/main.js"></script>
	<script src="js/corda.js"></script>
</body>
</html>
