<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1366 768" preserveAspectRatio="xMidYMid slice">
	<!-- Recriação vetorial do céu de flores (bg.png original era 1366x768 com artefatos de JPEG).
	     Cores do gradiente amostradas do original, de 5 em 5% da altura. -->
	<defs>
		<linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0%" stop-color="#30ffc9"/>
			<stop offset="5%" stop-color="#15fad0"/>
			<stop offset="10%" stop-color="#01dee1"/>
			<stop offset="15%" stop-color="#0cdbe9"/>
			<stop offset="20%" stop-color="#02d0f4"/>
			<stop offset="25%" stop-color="#1ae3e6"/>
			<stop offset="30%" stop-color="#18e4e4"/>
			<stop offset="35%" stop-color="#11dfef"/>
			<stop offset="40%" stop-color="#0ddaed"/>
			<stop offset="45%" stop-color="#03d7f9"/>
			<stop offset="50%" stop-color="#02caf7"/>
			<stop offset="55%" stop-color="#01b8ee"/>
			<stop offset="60%" stop-color="#01aee6"/>
			<stop offset="65%" stop-color="#00aae2"/>
			<stop offset="70%" stop-color="#01a3e3"/>
			<stop offset="75%" stop-color="#008fdb"/>
			<stop offset="80%" stop-color="#0191e0"/>
			<stop offset="85%" stop-color="#0187da"/>
			<stop offset="90%" stop-color="#0775e1"/>
			<stop offset="95%" stop-color="#086cdb"/>
			<stop offset="100%" stop-color="#0b6fde"/>
		</linearGradient>

		<!-- Uma flor: 5 pétalas em volta de um miolo, só contorno. Pétalas com escalas
		     levemente diferentes para não ficar geométrica demais. -->
		<g id="flor" fill="none" stroke-linecap="round">
			<path transform="rotate(0)" d="M 0,-14 C -34,-38 -42,-84 0,-94 C 42,-84 34,-38 0,-14"/>
			<path transform="rotate(74) scale(1.08)" d="M 0,-14 C -34,-38 -42,-84 0,-94 C 42,-84 34,-38 0,-14"/>
			<path transform="rotate(146) scale(0.94)" d="M 0,-14 C -34,-38 -42,-84 0,-94 C 42,-84 34,-38 0,-14"/>
			<path transform="rotate(216) scale(1.02)" d="M 0,-14 C -34,-38 -42,-84 0,-94 C 42,-84 34,-38 0,-14"/>
			<path transform="rotate(290) scale(0.97)" d="M 0,-14 C -34,-38 -42,-84 0,-94 C 42,-84 34,-38 0,-14"/>
			<circle r="9"/>
		</g>

		<filter id="desfoque" x="-40%" y="-40%" width="180%" height="180%">
			<feGaussianBlur stdDeviation="5"/>
		</filter>
	</defs>

	<rect width="1366" height="768" fill="url(#ceu)"/>

	<!-- flor verde, à esquerda -->
	<use href="#flor" transform="translate(185 300) rotate(18) scale(1.55)" stroke="#17a24b" stroke-width="5.5" opacity="0.9"/>

	<!-- flor cor de areia, no alto -->
	<use href="#flor" transform="translate(512 162) rotate(-12) scale(1.25)" stroke="#ebc287" stroke-width="5.5" opacity="0.95"/>

	<!-- flor azul-arroxeada, à direita, desfocada como no original -->
	<use href="#flor" transform="translate(1135 450) rotate(40) scale(2.3)" stroke="#4a5fd8" stroke-width="6.5" opacity="0.68" filter="url(#desfoque)"/>
</svg>
